name: Gobernanza & CI Check All

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-all:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Governance Pipeline (typecheck, lint, tokens, contrast, module boundaries, build)
        run: npm run check-all
