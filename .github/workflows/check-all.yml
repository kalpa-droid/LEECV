name: Gobernanza & CI Check All

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-all:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: check-version-bump compara la PR contra
          # origin/main (merge-base). Con fetch-depth 1 el merge-base no
          # existe y el chequeo fallaría (CI fail-closed por diseño).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Governance Pipeline (typecheck, lint, tokens, contrast, module boundaries, build)
        run: npm run check-all
