<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0816"/>
      <stop offset="50%" stop-color="#120e29"/>
      <stop offset="100%" stop-color="#080612"/>
    </linearGradient>

    <radialGradient id="glowGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6353fc" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6353fc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGlowRight" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#a048fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a048fc" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Gradients for Logo -->
    <linearGradient id="logoLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="40%" stop-color="#6d50fc"/>
      <stop offset="70%" stop-color="#6353fc"/>
      <stop offset="100%" stop-color="#a048fc"/>
    </linearGradient>

    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowGlow)"/>
  <rect width="1200" height="630" fill="url(#glowGlowRight)"/>

  <!-- Decorative Grid / Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(90, 110)">
    <!-- Brand Tag / Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#6353fc" fill-opacity="0.2" stroke="#6353fc" stroke-opacity="0.4" stroke-width="1"/>
    <text x="115" y="23" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#a5b4fc" text-anchor="middle" letter-spacing="1.5">TECNOLOGÍA DE CV NATIVA</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="Outfit, Montserrat, sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">
      Crea tu CV Profesional
    </text>
    <text x="0" y="170" font-family="Outfit, Montserrat, sans-serif" font-weight="900" font-size="54" fill="url(#logoLinear)" letter-spacing="-1">
      en PDF A4 Vectorial
    </text>

    <!-- Subtitle -->
    <text x="0" y="230" font-family="Inter, sans-serif" font-weight="400" font-size="22" fill="#94a3b8" width="580">
      Diseños ejecutivos imprimibles, diseño de tarjetas y 100% privacidad.
    </text>
    <text x="0" y="260" font-family="Inter, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
      Sin marcas de agua.
    </text>

    <!-- Feature Bullets -->
    <g transform="translate(0, 315)">
      <!-- Feature 1 -->
      <rect x="0" y="0" width="200" height="42" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="15" y="26" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#38bdf8">✓ Filtros ATS OK</text>

      <!-- Feature 2 -->
      <rect x="215" y="0" width="220" height="42" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="230" y="26" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#a7f3d0">✓ Exportación Vectorial</text>

      <!-- Feature 3 -->
      <rect x="450" y="0" width="180" height="42" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="465" y="26" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#c084fc">✓ Multi-Plantilla</text>
    </g>
  </g>

  <!-- Right Visual / Glassmorphism Preview Card -->
  <g transform="translate(730, 90)" filter="url(#glassShadow)">
    <rect x="0" y="0" width="380" height="450" rx="24" fill="#1e1b4b" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <rect x="1" y="1" width="378" height="448" rx="23" fill="none" stroke="url(#logoLinear)" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Inner Card Header (Logo Display) -->
    <g transform="translate(45, 60)">
      <!-- Master Logo Symbol & Text rendered nicely -->
      <!-- Symbol Path scaled -->
      <g transform="scale(1.4)">
        <path fill="url(#logoLinear)" d="M 30.75,0 C 26.17,0 21.85,2.12 19.05,5.75 L 0.75,29.50 C -1.02,31.81 0.62,35.16 3.53,35.16 H 17.45 C 19.91,35.16 21.29,37.97 19.79,39.92 L 0.73,64.66 C -1.04,66.97 0.60,70.32 3.51,70.32 H 19.21 C 22.17,70.32 24.60,72.67 24.71,75.63 L 25.46,97.79 C 25.54,100.05 28.52,100.82 29.69,98.88 L 63.92,41.93 C 65.74,38.91 63.56,35.06 60.03,35.06 H 49.05 C 46.88,35.06 45.66,32.58 46.98,30.86 L 63.89,8.90 C 72.80,11.46 80.91,16.83 86.40,24.39 C 95.01,35.66 97.18,51.23 92.36,64.52 C 90.62,70.05 89.15,71.48 84.62,74.62 C 84.86,72.21 86.01,70.01 86.96,67.83 C 88.45,64.63 90.35,61.54 91.78,58.28 C 92.34,56.50 91.74,54.10 89.82,53.45 C 88.14,52.95 86.66,54.39 85.98,55.78 C 83.71,60.21 82.72,65.14 80.84,69.73 L 78.96,72.75 L 77.79,63.18 L 74.22,54.44 L 70.60,54.44 L 72.42,66.17 L 73.96,72.73 C 71.02,68.68 68.82,64.16 65.82,60.16 C 64.97,59.20 64.10,57.93 62.72,57.78 C 61.58,57.64 60.64,58.54 60.34,59.57 L 61.95,67.87 C 64.13,71.28 67.09,74.10 69.57,77.24 C 64.93,75.27 61.27,71.63 56.72,69.51 C 55.13,68.66 52.85,68.35 51.53,69.83 C 50.37,71.29 49.71,73.63 51.06,75.18 C 52.80,77.33 55.59,78.11 58.06,79.08 L 66.96,82.51 C 62.10,84.22 56.81,84.36 52.05,86.36 L 49.78,89.75 C 50.40,91.98 59.11,92.28 64.70,91.31 L 52.90,96.06 L 54.78,100 C 62.57,100 89.44,97.18 101.20,59.61 C 105.08,40.97 97.06,20.57 81.53,9.55 C 73.17,3.43 62.86,0.08 52.50,0.02 H 50.83 Z"/>
        <!-- Text LEE -->
        <path fill="url(#logoLinear)" d="m 127.28,16.45 v 53.66 h 34.30 a 8.97,8.97 0 0 0 8.97,-8.97 v -6.68 a 2.28,2.28 0 0 0 -2.28,-2.28 h -19.35 l -10.81,7.20 a 1.72,1.72 0 0 1 -2.50,-2.21 l 2.37,-4.74 13.72,-41.17 a 1.79,1.79 0 0 0 -1.70,-2.36 h -17.30 a 6.57,6.57 0 0 0 -5.41,7.56 z m 48.69,0 v 53.66 h 34.30 a 8.97,8.97 0 0 0 8.97,-8.97 v -6.68 a 2.28,2.28 0 0 0 -2.28,-2.28 h -19.35 l -10.81,7.20 a 1.72,1.72 0 0 1 -2.50,-2.21 l 2.49,-4.99 3.60,-10.82 h 14.30 a 5.17,5.17 0 0 0 4.90,-3.53 l 1.85,-5.57 a 1.29,1.29 0 0 0 -1.23,-1.71 h -16.23 l 2.70,-8.10 a 3.97,3.97 0 0 1 3.77,-2.71 h 11.43 a 5.17,5.17 0 0 0 4.90,-3.53 l 1.64,-4.92 a 1.79,1.79 0 0 0 -1.70,-2.36 h -35.38 a 6.57,6.57 0 0 0 -5.41,7.56 z m 48.69,0 v 53.66 h 34.30 a 8.97,8.97 0 0 0 8.97,-8.97 v -6.68 a 2.28,2.28 0 0 0 -2.28,-2.28 h -19.35 l -10.81,7.20 a 1.72,1.72 0 0 1 -2.50,-2.21 l 2.49,-4.99 3.60,-10.82 h 14.30 a 5.17,5.17 0 0 0 4.90,-3.53 l 1.85,-5.57 a 1.29,1.29 0 0 0 -1.23,-1.71 h -16.23 l 2.70,-8.10 a 3.97,3.97 0 0 1 3.77,-2.71 h 11.43 a 5.17,5.17 0 0 0 4.90,-3.53 l 1.64,-4.92 a 1.79,1.79 0 0 0 -1.70,-2.36 h -35.38 a 6.57,6.57 0 0 0 -5.41,7.56 z"/>
      </g>
    </g>

    <!-- Simulated Document Content Wireframe -->
    <g transform="translate(45, 230)">
      <rect x="0" y="0" width="290" height="14" rx="7" fill="#ffffff" fill-opacity="0.7"/>
      <rect x="0" y="24" width="210" height="10" rx="5" fill="#6353fc" fill-opacity="0.6"/>

      <line x1="0" y1="50" x2="290" y2="50" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

      <!-- Section 1 -->
      <rect x="0" y="65" width="120" height="8" rx="4" fill="#38bdf8" fill-opacity="0.8"/>
      <rect x="0" y="80" width="270" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="0" y="92" width="240" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="0" y="104" width="255" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>

      <!-- Section 2 -->
      <rect x="0" y="125" width="140" height="8" rx="4" fill="#c084fc" fill-opacity="0.8"/>
      <rect x="0" y="140" width="280" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="0" y="152" width="220" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    </g>
  </g>
</svg>
